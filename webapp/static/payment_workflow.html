<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Workflow Drag & Drop</title>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui-touch-punch/0.2.3/jquery.ui.touch-punch.min.js"></script>
  <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.1/themes/base/jquery-ui.css">
  <style>

  </style>
  <style>
      body {font-family:Arial;padding:20px}
      .stage-box {display:flex;gap:20px;margin-top:20px}
      .box {flex:1;min-height:250px;padding:10px;border:2px dashed #bbb;border-radius:10px;background:#f8f8f8}
      .box h4 {margin-top:0}
      .item {padding:10px;margin:8px 0;background:white;border:1px solid #ccc;border-radius:6px;cursor:move;touch-action:none;position:relative}
      .ui-state-highlight {background:#e3f2ff;border-color:#409eff}
      #tabs {margin-top:20px}
      .save-btn {margin-top:10px;padding:8px 20px;border:none;background:#1971c2;color:white;border-radius:6px;cursor:pointer}
      .meta-badge {position:absolute;top:6px;right:6px;background:var(--accent);color:white;font-size:11px;padding:2px 6px;border-radius:12px;display:none}
      
      .ui-autocomplete-category {font-weight: bold;    padding: .2em .4em;    margin: .8em 0 .2em;    line-height: 1.5;  }
</style>
<script>
    const API_BASE_URL = (function(){
      const saved = localStorage.getItem('wh_api_base');
      if (saved) return saved;
      if (window.location.port === '8000') return window.location.origin;
      return window.location.origin;
    })();
</script>


</head>
<body>

<h2>Workflow Manager (Start → Review1 → Review2 → Final)</h2>
Date: <input type="text" id="datepicker">
<div id="tabs">
  <ul>
    <li><a href="#tab-start">Start</a></li>
    <li><a href="#tab-review1">Review 1</a></li>
    <li><a href="#tab-review2">Review 2</a></li>
    <li><a href="#tab-final">Final</a></li>
  </ul>

  <!-- ----------------------- START TAB ----------------------- -->
  <div id="tab-start">
    <h3>Start Stage</h3>
    <label for="search">Search: </label><input id="search">
    <button class="save-btn" id="save-start">Save & Move to Review 1</button>
    <div class="stage-box">
      <!-- Source -->
      <div id="start-source" class="box">
        <h4>Start Items</h4>
      </div>

      <!-- Drop Box -->
      <div id="start-next" class="box">
        <h4>Send to Review 1</h4>
      </div>
    </div>


  </div>


<!-- POPUP -->
<div id="itemDialog" title="Item Details" style="display:none;">
  <form id="dialogForm">
    <input type="hidden" id="dlg_id">
    <label>Description</label>
    <textarea id="dlg_desc" rows="4" style="width:100%"></textarea>

    <label>UPI</label>
    <input id="dlg_upi" type="text" style="width:100%" />

    <label>Upload File</label>
    <input id="dlg_file" type="file" />
  </form>
</div>


  <!-- ----------------------- REVIEW 1 TAB ----------------------- -->
  <div id="tab-review1">
    <h3>Review 1</h3>
    <button class="save-btn" id="save-review1">Save & Move to Review 2</button>
    <div class="stage-box">
      <div id="review1-source" class="box">
        <h4>Review 1 Items</h4>
      </div>

      <div id="review1-next" class="box">
        <h4>Send to Review 2</h4>
      </div>
    </div>


  </div>

  <!-- ----------------------- REVIEW 2 TAB ----------------------- -->
  <div id="tab-review2">
    <h3>Review 2</h3>
    <button class="save-btn" id="save-review2">Save & Move to Final</button>
    <div class="stage-box">
      <div id="review2-source" class="box">
        <h4>Review 2 Items</h4>
      </div>

      <div id="review2-next" class="box">
        <h4>Send to Final</h4>
      </div>
    </div>


  </div>

  <!-- ----------------------- FINAL TAB ----------------------- -->
  <div id="tab-final">
    <h3>Final</h3>

    <div class="stage-box">
      <div id="final-source" class="box">
        <h4>Final Approved Items</h4>
      </div>

      <div id="final-next" class="box" style="opacity:.4;">
        <h4>No More Stages</h4>
      </div>
    </div>
  </div>

</div>

<script>
let itemsData = [];
const STAGES = ["start","review1","review2","final"];
let ITEMS = [];
let META = {};

const LS_ITEMS = "wf_items_v3";
const LS_META  = "wf_meta_v3";
/* --------------------------------------------------------
   LOAD JSON ITEMS
--------------------------------------------------------- */
function loadItems() {
  // $.getJSON(jsonPath, function(data) {
  //   itemsData = data;
  //   renderAllTabs();
  // });
  // return
  
  $.ajax({
      url: `${API_BASE_URL}/rentalmonth/tillmonthrent`,
      type: "GET",
      dataType: "json",
      data: {
        year: 2025,
        month: 12
      },
      success: function (data) {
        itemsData = data;
        console.log(data);
        renderAllTabs();
        // loadGuests(currentPage);
      },
      error: function (xhr) {
        alert(
          "Error deleting guest: " +
            (xhr.responseJSON?.detail || "Unknown error")
        );
      },
    });
  
  

}



/* --------------------------------------------------------
   RENDER ITEMS INTO CORRECT TAB
--------------------------------------------------------- */
function renderAllTabs() {
  $(".box").each(function(){ $(this).find(".item").remove() });

  itemsData.forEach(item => {
    const card = makeItemCard(item);

    if (item.state === "active") $("#start-source").append(card);
    if (item.state === "Review1") $("#review1-source").append(card);
    if (item.state === "Review2") $("#review2-source").append(card);
    if (item.state === "Final") $("#final-source").append(card);
  });

  makeDraggable();
}



/* ---------------------------
   Make Card
----------------------------*/
function makeCard(it){
  const meta = META[it.id] || {};
  const hasMeta = meta.desc || meta.upi || meta.fileName;

  const $c = $(`
    <div class="item-card" data-id="${it.id}">
      <div class="meta-badge ${hasMeta ? 'visible':''}">●</div>
      <h6>${it.title} (#${it.id})</h6>
      <div>Name: ${it.name}</div>
      <div>Bed: ${it.bed_number}</div>
      <div>Amount: ₹${it.amount}</div>
    </div>
  `);
  //debugger;

  $c.on("click", function(){
    openDialog(it.id);
  });

  return $c;
}




/* ---------------------------
   Dialog for meta editing
----------------------------*/
function openDialog(id) {
  const card = $(`.item-card[data-id='${id}']`);
  
  // Read current metadata from the DOM
  const m = {
    desc: card.data("desc") || "",
    upi: card.data("upi") || "",
    fileName: card.data("fileName") || ""
  };

  $("#dlg_id").val(id);
  $("#dlg_desc").val(m.desc);
  $("#dlg_upi").val(m.upi);

  $("#itemDialog").dialog({
    modal: true,
    width: 400,
    buttons: {
      "Save": function () {
        const desc = $("#dlg_desc").val();
        const upi = $("#dlg_upi").val();
        const file = $("#dlg_file")[0].files[0];

        // Update card dataset ONLY (no localStorage)
        card.data("desc", desc);
        card.data("upi", upi);
        card.data("fileName", file ? file.name : m.fileName);

        // Show badge if any metadata exists
        if (desc || upi || file) {
          card.find(".meta-badge").addClass("visible");
        } else {
          card.find(".meta-badge").removeClass("visible");
        }

        $(this).dialog("close");
      },

      "Cancel": function () {
        $(this).dialog("close");
      }
    }
  });
}



/* --------------------------------------------------------
   MAKE CARD HTML
--------------------------------------------------------- */
function makeItemCard(it) {

  const $c = $(`
    <div class="item item-card" data-id="${it.id}">
      <div class="meta-badge">●</div>
      <h6>${it.title} (#${it.id})</h6>
      <div>Name: ${it.name}(${it.bed_number})</div>
      <div>Amount: ₹${it.amount}</div>
    </div>
  `);

  // APPLY METADATA FROM itemsData
  if (it.meta_desc)  $c.data("desc", it.meta_desc);
  if (it.meta_upi)   $c.data("upi", it.meta_upi);
  if (it.meta_file)  $c.data("fileName", it.meta_file);

  // Show badge if metadata exists
  if (it.meta_desc || it.meta_upi || it.meta_file) {
      $c.find(".meta-badge").addClass("visible");
  } else {
      $c.find(".meta-badge").removeClass("visible");
  }

  $c.on("click", function(){
    openDialog(it.id);
  });

  return $c;
}


/* --------------------------------------------------------
   DRAG & DROP HANDLERS
--------------------------------------------------------- */
function makeDraggable() {
  $(".item").draggable({
    revert: "invalid",
    helper: "clone",
    containment: "document"
  });

  // START → Review1
  $("#start-next").droppable({
    accept: "#start-source .item",
    drop: function(e, ui) { moveTo(ui.draggable, $("#start-next")); }
  });

  // Review1 → Review2
  $("#review1-next").droppable({
    accept: "#review1-source .item",
    drop: function(e, ui) { moveTo(ui.draggable, $("#review1-next")); }
  });

  // Review2 → Final
  $("#review2-next").droppable({
    accept: "#review2-source .item",
    drop: function(e, ui) { moveTo(ui.draggable, $("#review2-next")); }
  });
}

/* Move item DOM element */
function moveTo($item, $box) {
  $item.fadeOut(function() {
    $(this).appendTo($box).fadeIn();
  });
}

/* --------------------------------------------------------
   SAVE BUTTONS — Update States
--------------------------------------------------------- */
function saveStage(stage, nextStage) {
  let movedIds = [];

  $(`#${stage}-next .item`).each(function() {
    movedIds.push(parseInt($(this).data("id")));
  });

  itemsData.forEach(item => {
    if (movedIds.includes(item.id)) item.state = nextStage;
  });

  console.log("Updated State:", itemsData);

  renderAllTabs();
}

/* Save button events */
$("#save-start").click(() => saveStage("start", "Review1"));
$("#save-review1").click(() => saveStage("review1", "Review2"));
$("#save-review2").click(() => saveStage("review2", "Final"));

/* INIT */
$(function() {
  $("#tabs").tabs();
  loadItems();
});
</script>

  <script>
  $( function() {
    $.widget( "custom.catcomplete", $.ui.autocomplete, {
      _create: function() {
        this._super();
        this.widget().menu( "option", "items", "> :not(.ui-autocomplete-category)" );
      },
      _renderMenu: function( ul, items ) {
        var that = this,
          currentCategory = "";
        $.each( items, function( index, item ) {
          var li;
          if ( item.category != currentCategory ) {
            ul.append( "<li class='ui-autocomplete-category'>" + item.category + "</li>" );
            currentCategory = item.category;
          }
          li = that._renderItemData( ul, item );
          if ( item.category ) {
            li.attr( "aria-label", item.category + " : " + item.label );
          }
        });
      }
    });

    var itemsData = [];

 
    $.ajax({
        url: `${API_BASE_URL}/rentalmonth/guestswithdues`,
        type: "GET",
        dataType: "json",
        success: function (data) {
          itemsData = data;

          $( "#search" ).catcomplete({
            delay: 0,
            source: itemsData
          });
          // loadGuests(currentPage);
        },
        error: function (xhr) {
          alert(
            "Error deleting guest: " +
              (xhr.responseJSON?.detail || "Unknown error")
          );
        },
      });
    


  } );
  </script>

    <script>
  $( function() {
    $( "#datepicker" ).datepicker({
      changeMonth: true,
      changeYear: true
    });
  } );
  </script>

</body>
</html>
