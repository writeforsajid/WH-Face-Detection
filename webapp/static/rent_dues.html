<script>
  async function fetchDuesFromAPI(filters = {}) {
    const params = new URLSearchParams({
      guest_id: filters.guest_id,
      startDate: filters.startDate,
      endDate: filters.endDate,
      page: filters.page || 1,
      limit: filters.limit || 100
    });
    try {
      const url = `${API_BASE_URL}/rentalmonth/list_guest_dues${params.toString() ? ('?' + params.toString()) : ''}`;
      const res = await fetch(url, {
        headers: { "Accept": "application/json" }
      });

      if (!res.ok) throw new Error("Failed to fetch dues");

      //const json = await res.json();
      return await res.json();
      //return json.data || [];

    } catch (err) {
      console.error(err);
      alert("Unable to load dues data");
      return [];
    }
  }
</script>

<script>


  function renderDuesTable(data) {
    const tbody = document.querySelector("#duesTable tbody");
    tbody.innerHTML = "";
    if (!data.length) {
      tbody.innerHTML = `
        <tr>
          <td colspan="11" class="text-center text-muted">
            No dues found
          </td>
        </tr>`;
      return;
    }

    data.forEach(row => {
      const isEditable = row.status === "open";

      const tr = document.createElement("tr");
      tr.setAttribute("data-id", row.id);

      tr.innerHTML = `
        <td>${row.s_no}</td>
        <td>${row.due_type_name}</td>
        <td>${row.year}</td>
        <td>${row.month}</td>
        <td>
          ₹ ${row.due_amount}
          ${
            row.status === "open"
              ? `<i class="bi bi-pencil-square text-primary ms-2 cursor-pointer"
                  title="Edit Due Amount"
                  onclick="openDueEditModal(${row.id}, ${row.due_amount}, this)">
                </i>`
              : ""
          }
        </td>

        <td>₹ ${row.amount_paid}</td>
        <td>₹ ${row.balance}</td>

        <td>
          <span class="badge bg-${row.status === 'open' ? 'warning' : 'success'}">
            ${row.status}
          </span>
        </td>

        <td>${row.date}</td>
        <td>-</td>
      `;

      tbody.appendChild(tr);
    });
  }


  
  document.addEventListener("DOMContentLoaded", () => {
    const today = new Date().toISOString().split("T")[0];
    loadDues({ guest_id:'',startDate: today, endDate: today });
  });

  
</script>
<script>
      function renderSummary(summary) {
        document.getElementById("sumDue").innerText = summary.total_due_amount;
        document.getElementById("sumPaid").innerText = summary.total_amount_paid;
        document.getElementById("sumBalance").innerText = summary.total_balance;
      }

      function updatePageInfo(page, total) {
        document.getElementById("pageInfo").innerText =
          `Page ${page} (Total: ${total})`;
      }
</script>
<script>
  async function loadDues(filter) {
    lastFilter = filter;
    const response = await fetchDuesFromAPI({
      ...filter,
      page: currentPage
    });

    renderDuesTable(response.data);
    renderSummary(response.summary);
    updatePageInfo(currentPage, response.total);
  }
</script>
<script>
    function changePage(step) {
      if (currentPage + step < 1) return;
      currentPage += step;
      loadDues(lastFilter);
    }
</script>

<script>
function editDueInline(span, dueId, oldValue) {
  const input = document.createElement("input");
  input.type = "number";
  input.className = "form-control form-control-sm";
  input.value = oldValue;
  input.style.width = "100px";

  span.replaceWith(input);
  input.focus();

  const save = async () => {
    const newValue = parseFloat(input.value);

    if (isNaN(newValue) || newValue <= 0) {
      alert("Invalid amount");
      input.focus();
      return;
    }

    if (!confirm(`Save new due amount ₹${newValue}?`)) {
      input.replaceWith(span);
      return;
    }

    await saveDueAmount(dueId, newValue);

    span.textContent = `₹ ${newValue}`;
    input.replaceWith(span);

    const row = span.closest("tr");
    row.classList.add("row-updated");
  };

  //input.addEventListener("blur", save);
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") save();
    if (e.key === "Escape") input.replaceWith(span);
  });
}
</script>



<script>
  async function saveDueFromModal() {
  const input = document.getElementById("editDueAmount");
  const newAmount = parseFloat(input.value);

  if (isNaN(newAmount) || newAmount <= 0) {
    alert("Enter a valid amount");
    return;
  }

  if (!confirm(`Save new due amount ₹${newAmount}?`)) return;

  await saveDueAmount(editingDueId, newAmount);

  // update UI
  const cell = editingRow.children[4]; // due_amount column index
  cell.querySelector("i").previousSibling.textContent = `₹ ${newAmount}`;

  editingRow.classList.add("row-updated");

  editModal.hide();
}

async function saveDueAmount(dueId, amount) {

  const url = `${API_BASE_URL}/rentalmonth/update_due_amount`;
    const formData = new FormData();
    formData.append("id", dueId);
    formData.append("due_amount", amount);

    const res = await fetch(url, {
    method: "POST",
    body: formData
  });

  const json = await res.json();
  debugger;
  if (json.success !== true) {
    alert(json.message || "Update failed");
  }
}
</script>
