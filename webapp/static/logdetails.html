<script>
    /* ============================
       Configuration & small helpers
       ============================ */
    

		let currentFilter = {
    status: "success",
		message: "Data fetched successfully",
		filter: {startDate: new Date().toISOString().split("T")[0],
		endDate: new Date().toISOString().split("T")[0]}
		};

      //const logFilter = document.getElementById("logFilter");
      const output = document.getElementById("output");

      // Listen for custom event from the component
      document.addEventListener("filter-data", async (e) => {
        const filter = e.detail;  
        const user = JSON.parse(localStorage.getItem('wh_user') || '{}');
        const guestId = user.guest_id || '';
        const role = user.role || '';
        console.log("Received DATA:", filter);
        //let filter = document.getElementById("logFilter");
        let table = document.getElementById("table1");
        table.setParams({
          startDate: filter.startDate,
          endDate: filter.endDate,
          name: filter.heads,
          text: filter.metaDesc
        });


        currentFilter = {
				status: "success",
				message: "Data fetched successfully",
				filter
      };
      //fetchAttendance(1);
    });


    function formatDate(dStr) {
      if (!dStr) return '-';
      const d = new Date(dStr);
      return d.toLocaleDateString('en-GB', { year: 'numeric', month: 'short', day: 'numeric' });
    }
    function formatDateTime(dStr) {
      if (!dStr) return '-';
      const d = new Date(dStr);
      return d.toLocaleString('en-GB', { year: 'numeric', month: 'short', day: 'numeric', hour:'2-digit', minute:'2-digit' });
    }

    function showLoader(show=true) {
      document.getElementById('loading-overlay').style.display = show ? 'flex' : 'none';
    }

    function getTokenHeader() {
      const token = localStorage.getItem('wh_token') || '';
      return token ? { 'Authorization': `Bearer ${token}` } : {};
    }

    /* ============================
       Profile loading (keeps original fields)
       ============================ */
    async function loadGuestProfile() {
      // This function only populates profile fields and hides loader when done.
      // You asked to ignore menu/API specifics — we will still call /guests/{guestId}
      const token = localStorage.getItem('wh_token');
      if (!token) { window.location.href = 'login.html'; return; }

      const guestId = (JSON.parse(localStorage.getItem('wh_user') || '{}').guest_id) || '';
      if (!guestId) {
        // no guest -> redirect back
        return;
      }
      showLoader(true);

    }
  

    /* ============================
       Attendance fetching and rendering
       ============================ */

    // default dates: current month
    function setDefaultDates() {
				if (!currentFilter) {
					console.warn("Filter not yet set!");
				}

				const { startDate, endDate } = currentFilter.filter;
				if (!startDate || !endDate) {
				alert('Select both start and end dates');
				return;
				}
    }

 
  </script>
