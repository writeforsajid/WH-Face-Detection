function renderPage() {
    const container = $("#paymentContainer");
    container.empty();

    const start = (currentPage - 1) * PAGE_SIZE;
    const end = start + PAGE_SIZE;
    const pageData = fullData.slice(start, end);

    if (pageData.length === 0) {
        container.html("<p>No records</p>");
        return;
    }

    pageData.forEach(p => {
        const isUnpaid = p.rent_payment_id === 0;

        let duesRows = "";
        p.dues.forEach(d => {
            duesRows += `
                <tr>
                    <td>${monthYear(d.month, d.year)}</td>
                    <td>₹ ${d.due_amount}</td>
                    <td>₹ ${d.amount_paid}</td>
                    <td>₹ ${d.bal}</td>
                </tr>
            `;
        });

        const paymentTitle = isUnpaid
            ? "UNPAID DUES"
            : `<a href="/static/rent-receipt.html?id=${p.rent_payment_id}" class="payment-link">
                    Payment ID: ${p.rent_payment_id}
               </a>`;

        container.append(`
            <div class="payment-card ${isUnpaid ? 'unpaid-card' : ''}">
                <div class="payment-header">
                    <div>${paymentTitle}</div>
                    <span class="badge ${isUnpaid ? 'badge-unpaid' : 'badge-paid'}">
                        ${isUnpaid ? "UNPAID" : "APPROVED"}
                    </span>
                </div>

                ${!isUnpaid ? `
                    <div><strong>Amount:</strong> ₹ ${p.payment_amount}</div>
                    <div><strong>Date:</strong> ${p.payment_date}</div>
                ` : `
                    <div><strong>Total Due:</strong> ₹ ${p.cumulative_bal}</div>
                `}

                <table class="dues-table">
                    <thead>
                        <tr>
                            <th>Month</th>
                            <th>Due</th>
                            <th>Paid</th>
                            <th>Balance</th>
                        </tr>
                    </thead>
                    <tbody>${duesRows}</tbody>
                </table>
            </div>
        `);
    });

    renderPaginationControls();
}


function loadPayments() {
    $.ajax({
        url: `${API_BASE_URL}/rentalmonth/list_guest_payments?guest_id=${CURRENT_USER}`,
        method: "GET",
        success: renderPayments,
        error: () => $("#paymentContainer").html("<p>Error loading data</p>")
    });
}

$(document).ready(loadPayments);

<!--PAGINATION-->
<script>
function renderPaginationControls() {
    const totalPages = Math.ceil(fullData.length / PAGE_SIZE);

    $("#pagination").html(`
        <button onclick="prevPage()" ${currentPage === 1 ? "disabled" : ""}>
            ◀ Prev
        </button>

        <span style="margin:0 10px;">
            Page ${currentPage} of ${totalPages}
        </span>

        <button onclick="nextPage()" ${currentPage === totalPages ? "disabled" : ""}>
            Next ▶
        </button>
    `);
}

function prevPage() {
    if (currentPage > 1) {
        currentPage--;
        renderPage();
    }
}

function nextPage() {
    const totalPages = Math.ceil(fullData.length / PAGE_SIZE);
    if (currentPage < totalPages) {
        currentPage++;
        renderPage();
    }
}


</script>
