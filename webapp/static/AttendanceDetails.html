  <style>
    :root { --accent-1: #818cf8; --accent-2: #a78bfa; --muted:#6b7280; --card-bg: rgba(255,255,255,0.98); }
    *{box-sizing:border-box;margin:0;padding:0}

    }

    .page-header{background:linear-gradient(135deg,var(--accent-1),var(--accent-2));color:#fff;padding:14px;border-radius:10px;margin-bottom:14px;box-shadow:0 8px 30px rgba(129,140,248,0.16)}

    .profile-name h2{margin:0;font-size:1.25rem;font-weight:700}
    .profile-meta { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .meta-badge { padding:6px 10px; border-radius:999px; font-weight:600; font-size:.86rem; display:inline-flex; gap:8px; align-items:center; }
    .meta-active{ background:linear-gradient(135deg,#10b981,#059669); color:#fff }
    .meta-inactive{ background:linear-gradient(135deg,#ef4444,#dc2626); color:#fff }
    .meta-closed{ background:linear-gradient(135deg,#9ca3af,#6b7280); color:#fff }

    .profile-details{ display:flex; gap:12px; align-items:center; margin-left:auto; flex-wrap:wrap; }
    .info-item{ background: rgba(255,255,255,0.9); padding:8px 10px; border-radius:8px; border:1px solid rgba(129,140,248,0.06); min-width:120px; }
    .info-item .label{ font-size:.75rem; color:var(--accent-2); font-weight:700; text-transform:uppercase }
    .info-item .value{ font-weight:700; color:#3f2a7a; margin-top:4px }

    /* Attendance card */
    .attendance-card{ background:var(--card-bg); padding:12px; border-radius:10px; border:1px solid rgba(129,140,248,0.08); box-shadow:0 8px 24px rgba(129,140,248,0.06) }
    .filter-row{ display:flex; gap:8px; flex-wrap:wrap; align-items:end; margin-bottom:10px }
    .filter-row label{ font-size:.8rem; color:var(--muted); display:block; margin-bottom:4px }

    .table{ border-radius:8px; overflow:hidden; }
    .table thead th{ background:linear-gradient(135deg,var(--accent-1),var(--accent-2)); color:#fff; border:none; font-size:.82rem }
    .table tbody td{ vertical-align:middle; font-size:.88rem; padding:.6rem .8rem }

    .empty{ padding:14px; text-align:center; color:var(--muted) }

    #loading-overlay{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background: rgba(255,255,255,0.85); z-index:9999; }
    .loader-spinner{ width:54px; height:54px; border-radius:50%; border:6px solid rgba(129,140,248,0.18); border-top-color:var(--accent-1); animation:spin 1s linear infinite }
    @keyframes spin{ to{ transform:rotate(360deg) } }

    @media (max-width:767px){
      .profile-card{ flex-direction:column; align-items:flex-start; gap:10px }
      .profile-details{ margin-left:0; }
      .filter-row{ flex-direction:column; align-items:stretch }
    }

<!-- Page JS -->
  <script>
    /* ============================
       Configuration & small helpers
       ============================ */

	   

    function formatDate(dStr) {
      if (!dStr) return '-';
      const d = new Date(dStr);
      return d.toLocaleDateString('en-GB', { year: 'numeric', month: 'short', day: 'numeric' });
    }
    function formatDateTime(dStr) {
      if (!dStr) return '-';
      const d = new Date(dStr);
      return d.toLocaleString('en-GB', { year: 'numeric', month: 'short', day: 'numeric', hour:'2-digit', minute:'2-digit' });
    }

    function showLoader(show=true) {
      document.getElementById('loading-overlay').style.display = show ? 'flex' : 'none';
    }

    function getTokenHeader() {
      const token = localStorage.getItem('wh_token') || '';
      return token ? { 'Authorization': `Bearer ${token}` } : {};
    }

    /* ============================
       Profile loading (keeps original fields)
       ============================ */
    async function loadGuestProfile() {
      // This function only populates profile fields and hides loader when done.
      // You asked to ignore menu/API specifics — we will still call /guests/{guestId}
      const token = localStorage.getItem('wh_token');
      if (!token) { window.location.href = 'login.html'; return; }

      const guestId = (JSON.parse(localStorage.getItem('wh_user') || '{}').guest_id) || '';
      if (!guestId) {
        // no guest -> redirect back
        return;
      }

      try {
        showLoader(true);
        const res = await fetch(`${API_BASE_URL}/guests/${guestId}`, { headers: { ...getTokenHeader() }});
        if (!res.ok) throw new Error('Failed to load profile');
        const data = await res.json();

        // preserve formatting you asked: Name, Guest ID, Active, Bed Assignment, Assigned Date
        const g = data.guest || {};
        document.getElementById('guest-name').textContent = g.name || 'Unknown';
        document.getElementById('guest-id').textContent = g.guest_id || '-';
        document.getElementById('guest-bed').textContent = g.bed_id || g.bed_no || 'Not Assigned';
        document.getElementById('guest-assigned').textContent = formatDate(g.assign_date);

        const statusEl = document.getElementById('guest-status');
        const status = String(g.status || '').toLowerCase();
        statusEl.className = 'meta-badge';
        if (status === 'active') { statusEl.classList.add('meta-active'); statusEl.innerHTML = '<i class="bi bi-check-circle-fill"></i> Active'; }
        else if (status === 'inactive') { statusEl.classList.add('meta-inactive'); statusEl.innerHTML = '<i class="bi bi-x-circle-fill"></i> Inactive'; }
        else if (status === 'closed') { statusEl.classList.add('meta-closed'); statusEl.innerHTML = '<i class="bi bi-slash-circle"></i> Closed'; }
        else { statusEl.classList.add('meta-inactive'); statusEl.textContent = 'Unknown'; }

      } catch (e) {
        console.error(e);
        // keep placeholders
      } finally {
        showLoader(false);
      }
    }

    /* ============================
       Attendance fetching and rendering
       ============================ */

    // default dates: current month
    function setDefaultDates() {
      const now = new Date();
      const first = new Date(now.getFullYear(), now.getMonth(), 1);
      const last = new Date(now.getFullYear(), now.getMonth()+1, 0);
      document.getElementById('start-date').value = first.toISOString().slice(0,10);
      document.getElementById('end-date').value = last.toISOString().slice(0,10);
    }

 
  </script>














  <div class="container-main">
    <div id="menu-container"></div>
    <header class="page-header">
      <h1><i class="bi bi-person-lines-fill"></i> Guest Profile — Attendance</h1>
    </header>

    <!-- Profile -->
    <section id="profile-section" class="profile-card" aria-live="polite">
      <div class="avatar"><i class="bi bi-person-circle"></i></div>

      <div class="profile-main">
        <div class="profile-name">

    <!-- Attendance -->
    <section class="attendance-card" id="attendance-section" aria-live="polite">

      </div>

      <!-- Loading overlay -->
      <div id="loading-overlay" style="display:none;">
        <div>
          <div class="loader-spinner"></div>

        </div>
      </div>
      <table id="attendanceTable" class="table table-striped table-bordered">
          <thead>
              <tr>
                  <th>ID</th>
                  <th>Method</th>

                  <th>In Time</th>
                  <th>Out Time</th>
              </tr>
          </thead>
          <tbody></tbody>
      </table>


      <div id="pagination" class="mt-3 d-flex justify-content-center"></div>

      <!-- <nav id="attendance-pagination" class="d-flex justify-content-center mt-3" aria-label="Attendance pagination"></nav> -->
    </section>

  <!-- Loader -->
  <div id="loading-overlay" style="display:none;">
    <div style="text-align:center;">
      <div class="loader-spinner"></div>
      <div style="margin-top:10px;color:#4c3a97;font-weight:600">Working…</div>
    </div>
  </div>


  <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>

  <script>
    // ---------------------------
    // Configuration & helpers
    // ---------------------------
    const API_BASE_URL = (function(){
      const saved = localStorage.getItem('wh_api_base');
      if (saved) return saved;
      if (window.location.port === '8000') return window.location.origin;
      return 'http://localhost:8000';
    })();

    const PAGE_LIMIT = 50;   // fixed server-side page size per your request

    function showLoader(v=true){ document.getElementById('loading-overlay').style.display = v ? 'flex' : 'none'; }
    function getTokenHeader(){ const token = localStorage.getItem('wh_token') || ''; return token ? { 'Authorization': `Bearer ${token}` } : {}; }

    function formatDate(dStr){
      if (!dStr) return '-';
      const d = new Date(dStr);
      return d.toLocaleDateString('en-GB', { year:'numeric', month:'short', day:'numeric' });
    }
    function formatDateTime(dStr){
      if (!dStr) return '-';
      const d = new Date(dStr);
      return d.toLocaleString('en-GB', { year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
    }


    // ---------------------------





    
  async function fetchAttendance(page = 1) {
    const token = localStorage.getItem('wh_token');
    if (!token) {
      window.location.href = 'login.html';
      return;
    }

    const guestId = (JSON.parse(localStorage.getItem('wh_user') || '{}').guest_id) || '';
    if (!guestId) {
      alert('No guest selected');
      return;
    }

    const start = document.getElementById('start-date').value;
    const end = document.getElementById('end-date').value;
    if (!start || !end) {
      alert('Select both start and end dates');
      return;
    }

    showLoader(true);


    try {
      const url = new URL(`${API_BASE_URL}/attendance/records`);
      url.searchParams.set('guest_id', guestId);
      url.searchParams.set('start_date', start);
      url.searchParams.set('end_date', end);
      url.searchParams.set('page', page);
      url.searchParams.set('limit', PAGE_LIMIT);

      const res = await fetch(url.toString(), {
        headers: { ...getTokenHeader() }
      });

      if (!res.ok)
        throw new Error(`Request failed (${res.status})`);

      debugger;
      const payload = await res.json();
      const events = payload.events || payload.attendance || [];

      const meta = {
        total_pages: payload.total_pages || Math.ceil((payload.total_records || events.length) / PAGE_LIMIT),
        current_page: payload.current_page || page,
        total_records: payload.total_records || (payload.total || events.length),
        limit: payload.limit || PAGE_LIMIT
      };


      renderAttendanceTable(payload.data);          // your render function

      setupPagination(meta.total_records, meta.current_page);


    } catch (err) {
      console.error(err);

      document.getElementById('attendance-pagination').innerHTML = '';
    } finally {
      showLoader(false);
    }
  }


function renderAttendanceTable(data) {
    const tableBody = document.querySelector("#attendanceTable tbody");
    if (!tableBody) return;

    tableBody.innerHTML = ""; // Clear old data

    if (!data || data.length === 0) {
        tableBody.innerHTML = `
            <tr><td colspan="6" class="text-center text-muted">No records found</td></tr>
        `;
        return;
    }

    data.forEach(row => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${row.id}</td>
            <td>${row.method}</td>
            <td>${row.device_id}</td>
            <td>${row.in_time || ""}</td>
            <td>${row.out_time || ""}</td>
        `;
        tableBody.appendChild(tr);
    });
}

function setupPagination(total, currentPage) {
    const limit = 50;
    const totalPages = Math.ceil(total / limit);
    const pagination = document.getElementById("pagination");

    if (!pagination) return;

    pagination.innerHTML = "";

    // Previous button
    const prevBtn = document.createElement("button");
    prevBtn.textContent = "Prev";
    prevBtn.className = "btn btn-sm btn-outline-primary me-2";
    prevBtn.disabled = currentPage === 1;
    prevBtn.onclick = () => fetchAttendance(currentPage - 1);
    pagination.appendChild(prevBtn);

    // Number buttons
    for (let i = 1; i <= totalPages; i++) {
        const btn = document.createElement("button");
        btn.textContent = i;
        btn.className = `btn btn-sm ${i === currentPage ? "btn-primary" : "btn-outline-primary"} me-1`;
        btn.onclick = () => fetchAttendance(i);
        pagination.appendChild(btn);
    }

    // Next button
    const nextBtn = document.createElement("button");
    nextBtn.textContent = "Next";
    nextBtn.className = "btn btn-sm btn-outline-primary ms-2";
    nextBtn.disabled = currentPage === totalPages;
    nextBtn.onclick = () => fetchAttendance(currentPage + 1);
    pagination.appendChild(nextBtn);
}









    

    </script>
<script>
  function initAttendancePage() {
    console.log("Initializing Attendance Page...");

    // 1️⃣ Default date range
    setDefaultDates();

    // 2️⃣ Load guest profile info
    loadGuestProfile();

    // 3️⃣ Bind fetch button
    $("#fetch-btn").off("click").on("click", function () {
		
      console.log("Fetch button clicked");
      fetchAttendance(1);
    });

    

    console.log("Attendance page ready ✅");
  }

  // When header and layout are ready, call init
  $(window).on("load", function () {
    if ($("#fetch-btn").length) {
      initAttendancePage();
    } else {
      console.warn("Attendance UI not ready yet!");
    }
  });
</script>
