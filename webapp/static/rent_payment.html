<script>
document.addEventListener("DOMContentLoaded", function () {

    // 1️⃣ Set today's date in #currentDate
    let today = new Date().toISOString().split("T")[0];
    document.getElementById("currentDate").value = today;

    // 2️⃣ Highlight / select UPI button on load
    let upiBtn = document.getElementById("btnUpi");
    if (upiBtn) {
        upiBtn.classList.add("active");   // add visual style
    }
});
// ---------------- SELECT PAYMENT MODE ----------------
$(".mode-btn").click(function () {

    $(".mode-btn").removeClass("active");
    $(this).addClass("active");

    const selectedMode = $(this).data("mode");
    $("#paymentMode").val(selectedMode);

    console.log("Selected payment mode:", selectedMode);
});


function validatePaymentForm() {
    let errors = [];

    const paymentMode = document.getElementById("paymentMode").value;
    const amount = document.getElementById("txnAmount");
    const date = document.getElementById("currentDate");
    const txnId = document.getElementById("txnId");
    const desc = document.getElementById("description");

    // Reset invalid highlights
    [amount, date, txnId, desc].forEach(el => el.classList.remove("is-invalid"));

    // Validate Payment Mode
    if (!paymentMode) {
        errors.push("• Please select a payment mode");
    }

    // Validate Amount
    const amtValue = amount.value.trim();
    if (amtValue === "" || isNaN(amtValue) || Number(amtValue) <= 0) {
        amount.classList.add("is-invalid");
        errors.push("• Amount must be a valid positive number");
    }

    // Validate Date
    if (!date.value) {
        date.classList.add("is-invalid");
        errors.push("• Date cannot be empty");
    }

    // Validate Transaction ID
    if (txnId.value.trim().length < 4) {
        txnId.classList.add("is-invalid");
        errors.push("• Transaction ID must be at least 4 characters");
    }

    // Validate Description
    if (desc.value.trim() === "") {
        desc.classList.add("is-invalid");
        errors.push("• Description cannot be empty");
    }

    // If errors → show alert & return false
    if (errors.length > 0) {
        alert("Please fix the following:\n\n" + errors.join("\n"));
        return false;
    }

    return true; // All good!
}

// ---------------- FORM API Submit ----------------
document.getElementById("paymentForm").addEventListener("submit", function (e) {
    if (!validatePaymentForm()) {
        e.preventDefault();
    }
    const guestid = JSON.parse(localStorage.getItem('wh_user') || '{}').guest_id || ''; 
    const paymentMode = document.getElementById("paymentMode").value;
    const amount = document.getElementById("txnAmount").value.trim();;
    const currentDate = document.getElementById("currentDate").value.trim();;
    const txnId = document.getElementById("txnId").value.trim();;
    const desc = document.getElementById("description").value.trim();;
    const file = document.getElementById("attachment").files[0];
    let formData = new FormData();
    formData.append("guest_id", guestid);
    formData.append("txtAmount", amount);
    formData.append("paymentMode", paymentMode);
    formData.append("currentDate", currentDate);
    formData.append("txnId", txnId);
    formData.append("description", desc);

    if (file) {
        formData.append("attachment", file);
    }

    // Debug print
    console.log("Submitting Payment...");
    for (var pair of formData.entries()) {
        console.log(pair[0] + ": ", pair[1]);
    }
    // ---- SEND TO API (uncomment when backend ready) ----
    
    fetch("/rentalmonth/pay", {
        method: "POST",
        body: formData
    })
    .then(res => res.json())
    .then(data => {
        console.log("Server:", data);
        alert("Payment submitted!");
    })
    .catch(err => {
        console.error("Error:", err);
        alert("Error submitting payment");
    });
    
    
 });   

 
</script>
