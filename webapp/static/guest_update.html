<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Guest</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div id="menu-container"></div>

    <div class="container mt-5">
        <h3>Update Guest Details</h3>
        <form id="updateForm" class="mt-4">
            <div class="mb-3">
                <label class="form-label">Guest ID</label>
                <input type="number" id="guest_id" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" id="name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" id="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <input type="text" id="phone_number" class="form-control" pattern="\d{10}" maxlength="10" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Comments</label>
                <input type="text" id="comments" class="form-control" maxlength="10" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Status</label>
                <select id="status" class="form-select" required>
                    <option value="active">Active</option>
                    <option value="inactive">Inactive</option>
                    <option value="closed">Closed</option>
                    <option value="leave">Leave</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary">Update Guest</button>
        </form>

        <div id="result" class="mt-3"></div>
    </div>

    <script>
        $("#menu-container").load("header.html");

        $("#updateForm").on("submit", async function(e) {
            e.preventDefault();

            const meta = {
                guest_id: $("#guest_id").val(),
                name: $("#name").val(),
                email: $("#email").val(),
                phone_number: $("#phone_number").val(),
                comments: $("#comments").val(),
                status: $("#status").val()
            };

            try {
                const res = await fetch("http://localhost:8000/guests/update", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer VALID_TOKEN"  // ✅ send token here
                    },
                    body: JSON.stringify(meta)
                });

                const data = await res.json();
                if (res.ok) {
                    $("#result").html(`<div class="alert alert-success">${data.message}</div>`);
                    $("#updateForm")[0].reset();
                } else {
                    $("#result").html(`<div class="alert alert-danger">${data.detail}</div>`);
                }
            } catch (err) {
                $("#result").html(`<div class="alert alert-danger">${err}</div>`);
            }
        });
    </script>
</body>
</html>
