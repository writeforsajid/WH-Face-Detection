      function renderEmployeeTable(data) {
            const tbody = document.getElementById("employee-tbody");
            if (!tbody) {
              console.warn('renderEmployeeTable: #employee-tbody not found in DOM. Skipping render.');
              return;
            }
            tbody.innerHTML = "";
        data.forEach((emp) => {
          let statusClass = "",
            icon = "",
            statusText = "";
          if (!emp.start) {
            statusClass = "absent";
            icon = '<i class="bi bi-x-circle-fill"></i>';
            statusText = "Absent";
          } else if (emp.last_device_id === "EXIT_CAM") {
            statusClass = "left";
            icon = '<i class="bi bi-box-arrow-right"></i>';
            statusText = "Left for the day";
          } else {
            statusClass = "on-duty";
            icon = '<i class="bi bi-person-workspace"></i>';
            statusText = "On Duty";
          }

          tbody.innerHTML += `
        <tr class="${statusClass}">
          <td>${icon}${emp.name}</td>
          <td>${emp.start || "--"}</td>
          <td>${emp.end || "--"}</td>
          <td>${emp.duration}</td>
        </tr>`;
        });
      }

    <script>
      // Set dash-table guest id dynamically from localStorage so it's not hardcoded.
      (function () {
        // Try common locations for guest id in localStorage
        const user = JSON.parse(localStorage.getItem("wh_user") || "{}") || {};
        const guestId = user.guest_id || user.id || localStorage.getItem("guest_id");

        if (!guestId) {
          console.warn("No guest id found in localStorage (wh_user.guest_id / wh_user.id / guest_id).");
          return;
        }

        document.querySelectorAll("dash-table").forEach((el) => {
          try {
            el.setAttribute("data-guest", guestId);
            // ensure a default limit if not set
            if (!el.getAttribute("data-limit")) el.setAttribute("data-limit", "10");
            // If the component exposes loadData (it does), call it to refresh with the new guest
            if (typeof el.loadData === "function") {
              // call asynchronously to avoid blocking
              setTimeout(() => {
                try {
                  el.loadData();
                } catch (e) {
                  console.warn("dash-table loadData failed", e);
                }
              }, 0);
            }
          } catch (e) {
            console.warn("Failed to initialize dash-table for guest", e);
          }
        });
      })();
    </script>

    <!-- Auto-populate Guests Management tables with metadata and device logs -->
    <script>
      (async function populateGuestTables() {
        try {
          const user = JSON.parse(localStorage.getItem('wh_user') || '{}') || {};
          let guestId = user.guest_id || user.id || localStorage.getItem('guest_id');

          if (!guestId) {
            try {
              const r = await fetch('/guests?page=1&limit=1', { headers: { 'Accept': 'application/json' } });
              if (r.ok) {
                const j = await r.json();
                const items = j.items || j;
                if (Array.isArray(items) && items.length > 0) {
                  guestId = items[0].guest_id || items[0].id;
                }
              }
            } catch (e) {
              console.warn('Failed to fetch guest list for table population', e);
            }
          }

          if (!guestId) return;

          // Optionally set till_date to include older metadata (example below)
          // const tillQuery = '?till_date=2025-10-02';
          const tillQuery = '';

          const tables = Array.from(document.querySelectorAll('#guests-section dash-table'));
          tables.forEach((el) => {
            try {
              const head = (el.getAttribute('data-head') || '').toLowerCase();
              const limit = el.getAttribute('data-limit') || '10';

              if (head.includes('name') && head.includes('description')) {
                // request larger window (365 days) to include older metadata
                el.setAttribute('data-api', `/metadata/guest/${encodeURIComponent(guestId)}?days=365`);
              } else if (head.includes('device') || head.includes('entry') || head.includes('exit')) {
                el.setAttribute('data-api', `/attendance/guest_logs?guest_id=${encodeURIComponent(guestId)}&limit=${encodeURIComponent(limit)}`);
              } else {
                el.setAttribute('data-api', `/metadata/guest/${encodeURIComponent(guestId)}?days=365`);
              }

              if (typeof el.loadData === 'function') {
                try { el.loadData(); } catch (e) { console.warn('dash-table.loadData error', e); }
              }
            } catch (e) {
              console.warn('Failed to set data-api on dash-table', e);
            }
          });
        } catch (e) {
          console.warn('populateGuestTables unexpected error', e);
        }
      })();
    </script>

    <script>
      $(document).ready(function () {
        const labels = fakeApiData.map((d) => d.name);
        const durations = fakeApiData.map((d) => d.duration);
        const chartEl = document.getElementById("employeeChart");
        if (!chartEl) {
          console.warn('employeeChart canvas not found; skipping chart render.');
          return;
        }
        const ctx = chartEl.getContext("2d");
        new Chart(ctx, {
          type: "bar",
          data: {
            labels: labels,
            datasets: [
              {
                label: "Work Duration (hrs)",
                data: durations,
                backgroundColor: "rgba(255, 255, 255, 0.7)",
                borderColor: "rgba(255, 255, 255, 0.9)",
                borderWidth: 1,
                borderRadius: 6,
              },
            ],
          },
          options: {
            maintainAspectRatio: false,
            responsive: true,
            plugins: {
              legend: {
                display: false,
              },
              tooltip: {
                callbacks: {
                  label: (ctx) => `${ctx.parsed.y} hrs`,
                },
              },
            },
            scales: {
              x: {
                ticks: { color: "#fff", font: { weight: "600" } },
                grid: { display: false },
              },
              y: {
                ticks: { color: "#fff" },
                grid: { color: "rgba(255,255,255,0.2)" },
                beginAtZero: true,
              },
            },
          },
        });
      });
    </script>
