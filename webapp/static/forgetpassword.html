<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Forgot Password</title>
  <style>
    body { font-family: Arial; background: #f3f3f3; padding: 30px; }
    form { background: #fff; padding: 20px; max-width: 400px; margin: auto;
           border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    input, button { width: 100%; padding: 10px; margin-top: 10px; }
    button { background:#007bff; border:none; color:white; cursor:pointer; }
    button:hover { background:#0056b3; }
  </style>
</head>
<body>

<form id="resetRequestForm">
  <h2>Forgot Password</h2>
  <label>Email Address</label>
  <input type="email" id="email" required placeholder="Enter your email">

  <button type="submit">Send Reset Link</button>
</form>

<script>
document.getElementById("resetRequestForm").addEventListener("submit", function(e){
    e.preventDefault();

    const formData = new FormData();
    formData.append("email", document.getElementById("email").value);

    fetch("/auth/request_password_reset", {
        method: "POST",
        body: formData
    })
    .then(r => r.json())
    .then(d => alert(d.message))
    .catch(err => alert("❌ Error: " + err.message));
});
</script>

</body>
</html>
