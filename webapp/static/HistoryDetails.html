	<script>
		// API Base URL

		const API_BASE_URL = (function(){
			const saved = localStorage.getItem('wh_api_base');
			if (saved) return saved;
			if (window.location.port === '8000') return window.location.origin;
			return window.location.origin;
		})();
    	const PAGE_LIMIT = 50;   // fixed server-side page size per your request
		let g_payload = {};
		let g_events = [];
		let g_meta = {};
		let page = 1;
		
		let currentFilter = {
    	status: "success",
		message: "Data fetched successfully",
		filter: {startDate: new Date(new Date().setFullYear(new Date().getFullYear() - 1)).toISOString().split("T")[0],
		endDate: new Date().toISOString().split("T")[0],employeeId: "all"}
		};
		
		
		// let currentFilter = {
		// startDate:  new Date(new Date().setFullYear(new Date().getFullYear() - 1)).toISOString().split("T")[0],
		// endDate: new Date().toISOString().split("T")[0],
		// employeeId: "all"
		// };
		
		function getTokenHeader(){ const token = localStorage.getItem('wh_token') || ''; return token ? { 'Authorization': `Bearer ${token}` } : {}; }
		async function ensureLoggedInOrRedirect() {
			const token = localStorage.getItem('wh_token');
			if (!token) {
				window.location.href = 'login.html';
				return null;
			}
			return token;
		}

		function getGuestIdFromSession() {
			const userid = JSON.parse(localStorage.getItem('wh_user') || '{}').guest_id || '';
			return userid;
			// const params = new URLSearchParams(window.location.search);
			// return params.get('id');
		}

		function formatDate(dateString) {
			if (!dateString) return '-';
			const date = new Date(dateString);
			return date.toLocaleDateString('en-US', {
				year: 'numeric',
				month: 'short',
				day: 'numeric'
			});
		}

		function formatDateTime(dateString) {
			if (!dateString) return '-';
			const date = new Date(dateString);
			return date.toLocaleString('en-US', {
				year: 'numeric',
				month: 'short',
				day: 'numeric',
				hour: '2-digit',
				minute: '2-digit'
			});
		}

		function getMethodBadgeClass(method) {
			const lowerMethod = (method || '').toLowerCase();
			if (lowerMethod === 'face') return 'method-face';
			if (lowerMethod === 'rfid') return 'method-rfid';
			return 'method-manual';
		}

		function getMethodIcon(method) {
			const lowerMethod = (method || '').toLowerCase();
			if (lowerMethod === 'face') return '<i class="bi bi-person-bounding-box"></i>';
			if (lowerMethod === 'rfid') return '<i class="bi bi-credit-card-2-front"></i>';
			return '<i class="bi bi-pencil-square"></i>';
		}

    	function showLoader(show=true) {
      document.getElementById('loading-overlay').style.display = show ? 'flex' : 'none';
    }
		

		function renderGuestProfile(guest) {
			if (!guest || typeof guest !== 'object') {
				console.warn("Invalid guest data");
				return;
			}

			// Compute status badge
			const status = String(guest.status || '').toLowerCase();
			const statusEl = document.getElementById('guest-status');

			let badgeHtml = '';
			if (status === 'active') {
				badgeHtml = '<i class="bi bi-check-circle-fill"></i> Active';
				statusEl.className = 'badge-status badge-active';
			} else if (status === 'inactive') {
				badgeHtml = '<i class="bi bi-x-circle-fill"></i> Inactive';
				statusEl.className = 'badge-status badge-inactive';
			} else if (status === 'closed') {
				badgeHtml = '<i class="bi bi-slash-circle"></i> Closed';
				statusEl.className = 'badge-status badge-closed';
			} else {
				badgeHtml = '<i class="bi bi-question-circle"></i> Unknown';
				statusEl.className = 'badge-status badge-inactive';
			}
			statusEl.innerHTML = badgeHtml;

			// Fill all guest fields by ID
			document.getElementById('guest-name').textContent = guest.name || 'Unknown';
			document.getElementById('guest-id').textContent = guest.guest_id || '-';
			document.getElementById('guest-bed').textContent =
				guest.bed_id || guest.bed_no || 'Not Assigned';
			document.getElementById('guest-assign-date').textContent =
				formatDate(guest.assign_date);
			document.getElementById('guest-type').textContent =
				guest.guest_type || 'Standard';			

		}


		async function loadGuestDetails() {
			const token = await ensureLoggedInOrRedirect();
			if (!token) return;
			const guestId = getGuestIdFromSession();
			const userrole = JSON.parse(localStorage.getItem('wh_user') || '{}').role || '';
			if (!guestId) {
				alert('No guest ID provided');
				if (userrole === 'employee' || userrole === 'owner')
					window.location.href = 'admin_dashboard.html';
				else
					window.location.href = 'dashboard.html';
				return;
			}

			try {
				document.getElementById('loading-overlay').style.display = 'none';

				const token = localStorage.getItem('wh_token');
				if (!token) {
				window.location.href = 'login.html';
				return;
				}
				let guestId = (JSON.parse(localStorage.getItem('wh_user') || '{}').guest_id) || '';
				if (userrole === 'employee' || userrole === 'owner')
				{
					const urlParams = new URLSearchParams(window.location.search);
					guestId = urlParams.get('id') || (JSON.parse(localStorage.getItem('wh_user') || '{}').guest_id) || '';
				}
				
				if (!guestId) {
				alert('No guest selected');
				return;
				}

				// const start = document.getElementById('start-date').value;
				// const end = document.getElementById('end-date').value;
				if (!currentFilter) {
					console.warn("Filter not yet set!");
				}

				const { startDate, endDate } = currentFilter.filter;
				if (!startDate || !endDate) {
				alert('Select both start and end dates');
				return;
				}

				showLoader(true);
				if (!page) page = 1;
				const url = new URL(`${API_BASE_URL}/guests/history`);
				url.searchParams.set('guest_id', guestId);
				url.searchParams.set('start_date', startDate);
				url.searchParams.set('end_date', endDate);
				url.searchParams.set('page', page );
				url.searchParams.set('limit', PAGE_LIMIT);
				const res = await fetch(url.toString(), {
					headers: { 'Authorization': `Bearer ${token}` }
				});

				if (!res.ok)
					throw new Error(`Request failed (${res.status})`);

				g_payload = await res.json();
				g_events = g_payload.events || g_payload.attendance || [];
				g_meta = {
					total_pages: g_payload.total_pages || Math.ceil((g_payload.total_records || g_events.length) / PAGE_LIMIT),
					current_page: g_payload.current_page || page,
					total_records: g_payload.total_records || (g_payload.total || g_events.length),
					limit: g_payload.limit || PAGE_LIMIT
				};

				renderGuestProfile(g_payload.guest);
				//renderHistory(g_payload.data)
				fetchAttendance(1)
				showLoader(false);


			} catch (e) {
				console.error(e);
				alert(e.message || 'Failed to load guest details');
				window.location.href = 'Guests.html';
			}
		}


		async function fetchAttendance(page = 1) {

			try {
			
			//showLoader(true);
			renderAttendanceTable(g_payload.data);
			setupPagination(g_meta.total_records, g_meta.current_page);
			showLoader(false);
			} catch (err) {
			console.error(err);

			document.getElementById('attendance-pagination').innerHTML = '';
			} finally {
			showLoader(false);
			}
		}

		function metadata(page=1){

		}

		function renderAttendanceTable(data) {
			const tableBody = document.querySelector("#attendanceTable tbody");
			if (!tableBody) return;

			tableBody.innerHTML = ""; // Clear old data

			if (!data || data.length === 0) {
				tableBody.innerHTML = `
					<tr><td colspan="6" class="text-center text-muted">No records found</td></tr>
				`;
				return;
			}

			data.forEach(row => {
				const tr = document.createElement("tr");
				tr.innerHTML = `
					<td>${row.timestamp || ""}</td>
					<td>${row.name}</td>
					<td>${row.description}</td>
				`;
				tableBody.appendChild(tr);
			});
		}

		function setupPagination(total, currentPage) {
			const limit = 50;
			const totalPages = Math.ceil(total / limit);
			const pagination = document.getElementById("pagination");

			if (!pagination) return;

			pagination.innerHTML = "";

			// Previous button
			const prevBtn = document.createElement("button");
			prevBtn.textContent = "Prev";
			prevBtn.className = "btn btn-sm btn-outline-primary me-2";
			prevBtn.disabled = currentPage === 1;
			prevBtn.onclick = () => fetchAttendance(currentPage - 1);
			pagination.appendChild(prevBtn);

			// Number buttons
			for (let i = 1; i <= totalPages; i++) {
				const btn = document.createElement("button");
				btn.textContent = i;
				btn.className = `btn btn-sm ${i === currentPage ? "btn-primary" : "btn-outline-primary"} me-1`;
				btn.onclick = () => fetchAttendance(i);
				pagination.appendChild(btn);
			}

			// Next button
			const nextBtn = document.createElement("button");
			nextBtn.textContent = "Next";
			nextBtn.className = "btn btn-sm btn-outline-primary ms-2";
			nextBtn.disabled = currentPage === totalPages;
			nextBtn.onclick = () => fetchAttendance(currentPage + 1);
			pagination.appendChild(nextBtn);
		}


		async function addGuestMetadata() {
			const urlParams = new URLSearchParams(window.location.search);
			guestId = urlParams.get('id') || (JSON.parse(localStorage.getItem('wh_user') || '{}').guest_id) || '';

			const token = await ensureLoggedInOrRedirect();
			if (!token) return;
			//const guestId = document.getElementById("guest-id")?.textContent?.trim();
			const name = document.getElementById("meta-name").value.trim();
			const desc = document.getElementById("meta-desc").value.trim();
			const timestamp = document.getElementById("meta-date").value;

			if (!guestId) return alert("Guest ID not found.");
			if (!name) return alert("Please enter a metadata name.");
			if (!timestamp) return alert("Please select a date.");

				const payload = {
					guest_id: guestId,
					name: name,
					description: desc,
					timestamp: timestamp
				};

				try {
				// const url = new URL(`${API_BASE_URL}/guests/history`);
				// url.searchParams.set('guest_id', guestId);
				// url.searchParams.set('start_date', start);
				// url.searchParams.set('end_date', end);
				// url.searchParams.set('page', page);
				// url.searchParams.set('limit', PAGE_LIMIT);
				// debugger;
				// const res = await fetch(url.toString(), {
				// 	headers: { 'Authorization': `Bearer ${token}` }
				// });



				const res = await fetch(`${API_BASE_URL}/guests/add_metadata`, {
					method: "POST",
					headers: {
							"Content-Type": "application/json",
							"Authorization": `Bearer ${token}`
						},
					body: JSON.stringify(payload)
				});

				if (!res.ok) throw new Error(`Error: ${res.status}`);
				const data = await res.json();

				alert("Metadata added successfully!");
				// Automatically trigger your existing "Filter" button
				fetchAttendance(1);

				// Reset form fields
				document.getElementById("meta-name").value = "";
				document.getElementById("meta-desc").value = "";
				document.getElementById("meta-date").value = "";

				} catch (err) {
					console.error("Error adding metadata:", err);
					alert("Failed to add metadata. Check console for details.");
				}
			}



		// function handleLogout() {
		// 	// Optionally clear local/session storage if you want to fully log out
		// 	localStorage.removeItem('wh_token');
		// 	localStorage.removeItem('wh_user');

		// Create floating decorative elements
		function createFloatingElements() {
			const icons = ['bi-star-fill', 'bi-heart-fill', 'bi-gem', 'bi-flower1', 'bi-award-fill', 'bi-brightness-high-fill'];
			
			for (let i = 0; i < 6; i++) {
				const icon = document.createElement('i');
				icon.className = `bi ${icons[i]} floating-icon`;
				document.body.appendChild(icon);
			}
		}

		document.addEventListener('DOMContentLoaded', () => {
			createFloatingElements();
			loadGuestDetails();
			const addBtn = document.getElementById("btn-add-meta");
    		if (addBtn) addBtn.addEventListener("click", addGuestMetadata);
			console.log('active add guestmedata button connection');

			const fatchBtn = document.getElementById("fetch-btn");
			if (fatchBtn) {
				fatchBtn.addEventListener("click", () => fetchAttendance(1));
			}
		});
	</script>

	<script>
        async function fetchComboItems() {
            const apiBase = localStorage.getItem('wh_api_base') || window.location.origin;
            const token = localStorage.getItem('wh_token');
            
            const headers = {
                'Content-Type': 'application/json'
            };
            
            if (token) {
                headers['Authorization'] = `Bearer ${token}`;
            }

			try {
					const response = await fetch(`${apiBase}/system/appconfig?name=LOG_ITEMS`, { headers });
					if (!response.ok) throw new Error("Failed to fetch app config");
					const data = await response.json();
					// Example response: { name: "LOG_ITEMS", description: { options: [...] } }
					//const options = data.description?.options || [];
					let desc = data.description;
					// Replace single quotes with double quotes safely
					if (typeof desc === "string") {
						try {
							desc = desc.replace(/'/g, '"');
							desc = JSON.parse(desc);
						} catch (e) {
							console.error("Parsing failed:", e);
							desc = {};
						}
					}



					// Cache in memory for later use
					window.LOG_ITEMS = desc.options;
					const comboBox = document.getElementById("comboBox");
					// Clear existing except first
					comboBox.length = 1;
					// Populate dynamically
					window.LOG_ITEMS.forEach(item => {
					const opt = document.createElement("option");
					opt.value = item.value;
					opt.textContent = item.label;
					comboBox.appendChild(opt);
					});

					console.log("✅ LOG_ITEMS loaded:", desc);
            } catch (error) {
                console.error('Error fetching dashboard data:', error);
                // Set default values on error
                //setDefaultValues();
            }


		}			
			
			
			$(document).ready(function() {
			// While typing, reset combo to default

				
				fetchComboItems();
				$("#meta-name").on("input", function() {
					if ($(this).val().trim() !== "") {
					$("#comboBox").val(""); // reset dropdown
					}
				});
				  // 🔹 When user chooses combo value → set textbox value
				$("#comboBox").on("change", function() {
					const selected = $(this).val();
					$("#meta-name").val(selected);
				});
			});



	</script>
