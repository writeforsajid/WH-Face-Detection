<body class="admin-bg">
  <!-- Loading overlay removed for FAQ page -->
	<!-- Main Content -->
	<div class="page-wrapper">
		<div id="menu-container"></div>
    <div class="page-header">
      <div class="page-header-content">
          <div>
            <h1><i class="bi bi-people-fill"></i> Rental Month Records</h1>
          </div>

    </div>
    <div class="card">
      <div class="card-body" style='padding: 10px 2%;'>



      <employee-filter  data-api="/guests/active"> </employee-filter>
    

      <smart-table
        id="leaveTable"
        data-api="/rentalmonth/records"
        data-title="Rents status"
        data-id-key="id" 
        data-auto-load="false"
        data-columns='[
          {"key":"id","label":"ID"},
          {"key":"guest_name","label":"Guest Name"},
          {"key":"due_type_name","label":"Due Type"},          
          {"key":"year","label":"Year"},
          {"key":"month","label":"Month"},
          {"key":"due_amount","label":"Due_Amount"},
          {"key":"amount_paid","label":"Amount_Paid"},
          {"key":"status","label":"Status"},
          {"key":"created_at","label":"Created At"}
        ]'

      >
      </smart-table>

      </div>
    
    
    </div>

    <!-- APPROVAL CONFIRMATION MODAL -->
  <div class="modal fade" id="approveModal" tabindex="-1">

      <div class="modal-content" style="color: #000;">

        <div class="modal-header bg-success text-white">

          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <p>Are you sure you want to approve the selected record(s)?</p>
          <div id="approveList" class="p-2 bg-light border rounded" style="max-height:150px; overflow:auto;"></div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button id="confirmApproveBtn" type="button" class="btn btn-success">
            Yes, Approve
          </button>
        </div>

      </div>
    </div>
  </div>


	<script src="./js/main.js"></script>
	<script>

			$("#username").text(username);
		});
	</script>



  <script>
    
  let currentFilter = {

<script>
customElements.whenDefined("smart-table").then(() => {
    const table = document.getElementById("leaveTable");

    // APPLY FORMATTERS
    table.setFormatters({
        start_date: (v) => v ? new Date(v).toLocaleDateString("en-GB") : "",
        end_date: (v) => v ? new Date(v).toLocaleDateString("en-GB") : "",
        status: (v) => (v || "").toString().toUpperCase()
    });

    // DEFAULT FILTER INIT
    table.setParams({
        guest_id:  "all",
        start_date: new Date().toISOString().split("T")[0],
        end_date: new Date().toISOString().split("T")[0]
    });
    // listen to bulk actions — event name = action
    table.addEventListener("approve", e => {
        const rows = e.detail.rows;
        console.log("Approve bulk:", rows);

        // Put selected rows in modal list
        const list = rows.map(r => `<div>✔ ID: ${r.id} — Month: ${r.month}/${r.year}</div>`).join("");
        document.getElementById("approveList").innerHTML = list;

        // Show modal
        const modal = new bootstrap.Modal(document.getElementById("approveModal"));
        modal.show();

        // Handle confirm button
        document.getElementById("confirmApproveBtn").onclick = async () => {
            console.log("User confirmed approval:", rows);

            // Example API call
            try {
                const res = await fetch("/rentalmonth/approve", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ rows })
                });

                alert("Approved successfully!");
                modal.hide();
                table.load();
            } catch (err) {
                alert("Error approving records.");
            }
        };
    });


    table.addEventListener("delete", e => {
      const rows = e.detail.rows;
      console.log("Delete bulk:", rows);
    });
    // INITIAL LOAD
    table.load();
});
</script>



	<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
