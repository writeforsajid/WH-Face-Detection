  <script>
    async function submitLeave() {

        // Clear error messages
        document.querySelectorAll(".error").forEach(e => e.textContent = "");

        const type = document.getElementById("leave_type_id").value;
        const start = document.getElementById("start_date").value;
        const end = document.getElementById("end_date").value;
        const reason = document.getElementById("reason").value.trim();

        let valid = true;

        if (!type) {
            document.getElementById("errType").textContent = "Select leave type.";
            valid = false;
        }
        if (!start) {
            document.getElementById("errStart").textContent = "Start date required.";
            valid = false;
        }
        if (!end) {
            document.getElementById("errEnd").textContent = "End date required.";
            valid = false;
        }
        if (start && end) {
            let s = new Date(start);
            let e = new Date(end);

            if (e <= s) {
                document.getElementById("errEnd").textContent = "End date must be greater than start date.";
                valid = false;
            }
        }
        if (!reason) {
            document.getElementById("errReason").textContent = "Description cannot be blank.";
            valid = false;
        }

        if (!valid) return;
        // Prepare payload
        const payload = {
            guest_id: JSON.parse(localStorage.getItem('wh_user') || '{}').guest_id || '',
            leave_type_id: Number(type),
            start_date: start,
            end_date: end,
            reason: reason
        };

        // Call API
        const res = await fetch("/leave/apply", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (res.ok) {
            alert("Leave Applied Successfully");
            document.getElementById("leaveForm").reset();
        } else {
            alert("Error: " + data.detail);
        }
    }
  </script>

<script>
customElements.whenDefined("smart-table").then(() => {
    const table = document.getElementById("leaveTable");

    // APPLY FORMATTERS
    table.setFormatters({
        start_date: (v) => v ? new Date(v).toLocaleDateString("en-GB") : "",
        end_date: (v) => v ? new Date(v).toLocaleDateString("en-GB") : "",
        status: (v) => (v || "").toString().toUpperCase()
    });

    // DEFAULT FILTER INIT
    table.setParams({
        startDate: new Date().toISOString().split("T")[0],
        endDate: new Date().toISOString().split("T")[0]
    });
    // listen to bulk actions — event name = action
    table.addEventListener("approve", e => {
      const rows = e.detail.rows;
      console.log("Approve bulk:", rows);
      // call API to approve rows
    });

    table.addEventListener("delete", e => {
      const rows = e.detail.rows;
      console.log("Delete bulk:", rows);
    });
    // INITIAL LOAD
    table.load();
});
</script>
