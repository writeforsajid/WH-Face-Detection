  <script>

		let currentFilter = {

    function formatDate(dStr) {
      if (!dStr) return '-';
      const d = new Date(dStr);
      return d.toLocaleDateString('en-GB', { year: 'numeric', month: 'short', day: 'numeric' });
    }
    function formatDateTime(dStr) {
      if (!dStr) return '-';
      const d = new Date(dStr);
      return d.toLocaleString('en-GB', { year: 'numeric', month: 'short', day: 'numeric', hour:'2-digit', minute:'2-digit' });
    }

    function showLoader(show=true) {
      document.getElementById('loading-overlay').style.display = show ? 'flex' : 'none';
    }

    function getTokenHeader() {
      const token = localStorage.getItem('wh_token') || '';
      return token ? { 'Authorization': `Bearer ${token}` } : {};
    }

    /* ============================
       Profile loading (keeps original fields)
       ============================ */
    async function loadGuestProfile() {
      // This function only populates profile fields and hides loader when done.
      // You asked to ignore menu/API specifics — we will still call /guests/{guestId}
      const token = localStorage.getItem('wh_token');
      if (!token) { window.location.href = 'login.html'; return; }

      const guestId = (JSON.parse(localStorage.getItem('wh_user') || '{}').guest_id) || '';
      if (!guestId) {
        // no guest -> redirect back
        return;
      }

      try {
        showLoader(true);
        



        
        const res = await fetch(`${API_BASE_URL}/guests/${guestId}`, { headers: { ...getTokenHeader() }});
        if (!res.ok) throw new Error('Failed to load profile');
        const data = await res.json();

        // preserve formatting you asked: Name, Guest ID, Active, Bed Assignment, Assigned Date
        const g = data.guest || {};
        document.getElementById('guest-name').textContent = g.name || 'Unknown';
        document.getElementById('guest-id').textContent = g.guest_id || '-';
        document.getElementById('guest-bed').textContent = g.bed_id || g.bed_no || 'Not Assigned';
        document.getElementById('guest-assigned').textContent = formatDate(g.assign_date);

        const statusEl = document.getElementById('guest-status');
        const status = String(g.status || '').toLowerCase();
        statusEl.className = 'meta-badge';
        if (status === 'active') { statusEl.classList.add('meta-active'); statusEl.innerHTML = '<i class="bi bi-check-circle-fill"></i> Active'; }
        else if (status === 'inactive') { statusEl.classList.add('meta-inactive'); statusEl.innerHTML = '<i class="bi bi-x-circle-fill"></i> Inactive'; }
        else if (status === 'closed') { statusEl.classList.add('meta-closed'); statusEl.innerHTML = '<i class="bi bi-slash-circle"></i> Closed'; }
        else { statusEl.classList.add('meta-inactive'); statusEl.textContent = 'Unknown'; }

      } catch (e) {
        console.error(e);
        // keep placeholders
      } finally {
        showLoader(false);
      }
    }

    /* ============================
       Attendance fetching and rendering
       ============================ */

    // default dates: current month
    function setDefaultDates() {
				if (!currentFilter) {

				}

				const { startDate, endDate } = currentFilter;
				if (!startDate || !endDate) {
				alert('Select both start and end dates');
				return;
				}
    }

 
  </script>

  <script>
    // ---------------------------
    // Configuration & helpers
    // ---------------------------
    const API_BASE_URL = (function(){
      const saved = localStorage.getItem('wh_api_base');
      if (saved) return saved;
      if (window.location.port === '8000') return window.location.origin;
      return window.location.origin;
    })();

    const PAGE_LIMIT = 50;   // fixed server-side page size per your request

    function showLoader(v=true){ document.getElementById('loading-overlay').style.display = v ? 'flex' : 'none'; }
    function getTokenHeader(){ const token = localStorage.getItem('wh_token') || ''; return token ? { 'Authorization': `Bearer ${token}` } : {}; }

    function formatDate(dStr){
      if (!dStr) return '-';
      const d = new Date(dStr);
      return d.toLocaleDateString('en-GB', { year:'numeric', month:'short', day:'numeric' });
    }
    function formatDateTime(dStr){
      if (!dStr) return '-';
      const d = new Date(dStr);
      return d.toLocaleString('en-GB', { year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
    }


    // ---------------------------





    
  async function fetchAttendance(page = 1) {
    
    const token = localStorage.getItem('wh_token');
    const userrole = (JSON.parse(localStorage.getItem('wh_user') || '{}').role) || '';
    let guestId = (JSON.parse(localStorage.getItem('wh_user') || '{}').guest_id) || '';
    if (!token) {
      window.location.href = 'login.html';
      return;
    }
    if (userrole === 'employee' || userrole === 'owner')
    {
      guestId = 'all';
    }
   
    if (!guestId) {
      alert('No guest selected');
      return;
    }
    const { startDate, endDate } = currentFilter;
    if (!startDate || !endDate) {
    alert('Select both start and end dates');
    return;
    }

    showLoader(true);


    try {
      const url = new URL(`${API_BASE_URL}/attendance/records`);
      url.searchParams.set('guest_id', guestId);
      url.searchParams.set('role_name', 'resident');
      url.searchParams.set('start_date', startDate);
      url.searchParams.set('end_date', endDate);
      url.searchParams.set('page', page);
      url.searchParams.set('limit', PAGE_LIMIT);

      const res = await fetch(url.toString(), {
        headers: { ...getTokenHeader() }
      });

      if (!res.ok)
        throw new Error(`Request failed (${res.status})`);

      debugger;
      const payload = await res.json();
      const events = payload.events || payload.attendance || [];

      const meta = {
        total_pages: payload.total_pages || Math.ceil((payload.total_records || events.length) / PAGE_LIMIT),
        current_page: payload.current_page || page,
        total_records: payload.total_records || (payload.total || events.length),
        limit: payload.limit || PAGE_LIMIT
      };


      renderAttendanceTable(payload.data);          // your render function

      setupPagination(meta.total_records, meta.current_page);


    } catch (err) {
      console.error(err);

      document.getElementById('attendance-pagination').innerHTML = '';
    } finally {
      showLoader(false);
    }
  }


function renderAttendanceTable(data) {
    const tableBody = document.querySelector("#attendanceTable tbody");
    if (!tableBody) return;

    tableBody.innerHTML = ""; // Clear old data

    if (!data || data.length === 0) {
        tableBody.innerHTML = `
            <tr><td colspan="6" class="text-center text-muted">No records found</td></tr>
        `;
        return;
    }

    data.forEach(row => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${row.id}</td>
            <td>${row.name}</td>
            <td>${row.device_id}</td>
            <td>${row.date}</td>
            <td>${row.in_time || ""}</td>
            <td>${row.out_time || ""}</td>
        `;
        tableBody.appendChild(tr);
    });
}

function setupPagination(total, currentPage) {
    const limit = 50;
    const totalPages = Math.ceil(total / limit);
    const pagination = document.getElementById("pagination");

    if (!pagination) return;

    pagination.innerHTML = "";

    // Previous button
    const prevBtn = document.createElement("button");
    prevBtn.textContent = "Prev";
    prevBtn.className = "btn btn-sm btn-outline-primary me-2";
    prevBtn.disabled = currentPage === 1;
    prevBtn.onclick = () => fetchAttendance(currentPage - 1);
    pagination.appendChild(prevBtn);

    // Number buttons
    for (let i = 1; i <= totalPages; i++) {
        const btn = document.createElement("button");
        btn.textContent = i;
        btn.className = `btn btn-sm ${i === currentPage ? "btn-primary" : "btn-outline-primary"} me-1`;
        btn.onclick = () => fetchAttendance(i);
        pagination.appendChild(btn);
    }

    // Next button
    const nextBtn = document.createElement("button");
    nextBtn.textContent = "Next";
    nextBtn.className = "btn btn-sm btn-outline-primary ms-2";
    nextBtn.disabled = currentPage === totalPages;
    nextBtn.onclick = () => fetchAttendance(currentPage + 1);
    pagination.appendChild(nextBtn);
}
