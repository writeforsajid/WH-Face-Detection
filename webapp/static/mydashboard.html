];


  function renderEmployeeTable(data) {
    const tbody = document.getElementById("employee-tbody");
    tbody.innerHTML = "";
    data.forEach(emp => {
      let statusClass = "", icon = "", statusText = "";
      if (!emp.start) { 
        statusClass = "absent"; 
        icon = '<i class="bi bi-x-circle-fill"></i>'; 
        statusText = "Absent";
      }
      else if (emp.last_device_id === "EXIT_CAM") { 
        statusClass = "left"; 
        icon = '<i class="bi bi-box-arrow-right"></i>'; 
        statusText = "Left for the day";
      }
      else { 
        statusClass = "on-duty"; 
        icon = '<i class="bi bi-person-workspace"></i>'; 
        statusText = "On Duty";
      }

      tbody.innerHTML += `
        <tr class="${statusClass}">
          <td>${icon}${emp.name}</td>
          <td>${emp.start || "--"}</td>
          <td>${emp.end || "--"}</td>
          <td>${emp.duration}</td>
        </tr>`;
    });
  }

});
</script>

    <script>
      $(document).ready(function () {
    const labels = fakeApiData.map(d => d.name);
    const durations = fakeApiData.map(d => d.duration);
    const ctx = document.getElementById('employeeChart').getContext('2d');
    new Chart(ctx, {
        type: 'bar',
        data: {
        labels: labels,
        datasets: [{
            label: 'Work Duration (hrs)',
            data: durations,
            backgroundColor: 'rgba(255, 255, 255, 0.7)',
            borderColor: 'rgba(255, 255, 255, 0.9)',
            borderWidth: 1,
            borderRadius: 6,
        }]
        },
        options: {
        maintainAspectRatio: false,
        responsive: true,
        plugins: {
            legend: {
            display: false
            },
            tooltip: {
            callbacks: {
                label: ctx => `${ctx.parsed.y} hrs`
            }
            }
        },
        scales: {
            x: {
            ticks: { color: '#fff', font: { weight: '600' } },
            grid: { display: false }
            },
            y: {
            ticks: { color: '#fff' },
            grid: { color: 'rgba(255,255,255,0.2)' },
            beginAtZero: true
            }
        }
        }
    });
      });
    </script>
