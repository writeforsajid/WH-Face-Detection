<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Guest Management</title>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.2/css/bootstrap.min.css">
	<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
	<!-- header styles moved to Header.html -->
	<link rel="stylesheet" href="./css/style.css">

	  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

 
  </head>
  <body class="admin-bg">
    <!-- Wrap header + page header + table into a single page wrapper so the injected header
     and the page content share the same containing block -->
    <div class="page-wrapper">
      <div id="menu-container"></div>

      <!-- Page Header (Full Width) -->
      <div class="page-header" style="background: linear-gradient(135deg, #ff6b6b 0%, #ce8bfa 100%)">
        <div class="page-header-content">
          <div>
            <h1><i class="bi bi-people-fill"></i> Employees</h1>
          </div>
        </div>
      </div>

      <div class="">
        <!-- Guest Table -->
        <table class="table table-striped table-bordered">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Type</th>
             <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="guestTable"></tbody>
        </table>

        <nav>
          <ul class="pagination justify-content-center" id="pagination"></ul>
        </nav>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
    <script>
      // ------------------- Load Guests -------------------
      let currentPage = 1;
      const API_BASE_URL = "http://localhost:8000";

      // function handleBack() {
      //   try {
      //     if (document.referrer && window.history.length > 1) {
      //       window.history.back();
      //       return;
      //     }
      //   } catch (e) { /* ignore */ }
      //   // Fallback to Beds page if no history
      //   window.location.href = 'Bed_Guest_Relationship.html';
      // }

      function loadGuests(page = 1) {
        $.ajax({
          url: `${API_BASE_URL}/employees?page=${page}&limit=20`,
          type: "GET",
          success: function (data) {
            let rows = "";
            if (data.items && data.items.length > 0) {
              data.items.forEach((g) => {
                rows += `<tr>
            <td>${g.guest_id}</td>
            <td><a href="${API_BASE_URL}/static/historydetails.html?id=${g.guest_id}" target="_blank">${g.name}</a></td>
            <td>${g.guest_type || "-"}</td>
            <td>${g.status || "-"}</td>
            <td>
              <button class="btn btn-sm btn-outline-secondary" onclick="toggleGuestStatus('${
                g.guest_id
              }')">
                <i class="bi bi-toggle-on"></i> Toggle
              </button>
              <button class="btn btn-danger btn-sm" onclick="deleteGuest('${
                g.guest_id
              }')">
                <i class="bi bi-trash"></i> Delete
              </button>
            </td>
          </tr>`;
              });
            } else {
              rows = `<tr><td colspan="6" class="text-center">No guests found</td></tr>`;
            }
            $("#guestTable").html(rows);

            // Pagination
            let pagination = "";
            for (let i = 1; i <= data.total_pages; i++) {
              pagination += `<li class="page-item ${
                i === page ? "active" : ""
              }">
          <a class="page-link" href="#" onclick="loadGuests(${i}); return false;">${i}</a>
        </li>`;
            }
            $("#pagination").html(pagination);
            currentPage = page;
          },
          error: function (xhr) {
            console.error("Error loading guests:", xhr);
            $("#guestTable").html(
              `<tr><td colspan="6" class="text-center text-danger">Error loading guests: ${
                xhr.responseJSON?.detail ||
                xhr.statusText ||
                "Server not reachable"
              }</td></tr>`
            );
          },
        });
      }

      // ------------------- Delete Guest -------------------
      function deleteGuest(id) {
        if (confirm("Delete this guest?")) {
          $.ajax({
            url: `${API_BASE_URL}/guests/${id}`,
            type: "DELETE",
            success: function () {
              loadGuests(currentPage);
            },
            error: function (xhr) {
              alert(
                "Error deleting guest: " +
                  (xhr.responseJSON?.detail || "Unknown error")
              );
            },
          });
        }
      }

      // ------------------- Active/Inactive Guest -------------------
      function toggleGuestStatus(guest_id) {
        $.ajax({
          url: `${API_BASE_URL}/guests/${guest_id}/toggle`,
          type: "PUT",
          success: function (res) {
            alert(`Guest is now ${res.active ? "Active" : "Inactive"}`);
            loadGuests();
          },
          error: function (xhr) {
            alert(xhr.responseJSON?.detail || "Error toggling guest status");
          },
        });
      }

      // ------------------- Initial Load -------------------
      loadGuests();
    </script>

    <script src="./js/main.js"></script>
    <script>
      $(document).ready(function () {
        const username =
          JSON.parse(localStorage.getItem("wh_user") || "{}").name || "";
        if (!username) window.location.href = "login.html";
        $("#username").text(username);
      });
    </script>
  </body>
</html>
