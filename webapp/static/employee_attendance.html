<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Employee Filter Demo</title>


	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.2/css/bootstrap.min.css">
	<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
	<!-- header styles moved to Header.html -->
	<link rel="stylesheet" href="./css/style.css">

	  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script type="module" src="/static/components/employee-filter.js"></script>
</head>
<body class="admin-bg">
  	<!-- Main Content -->


  
<div class="page-wrapper">
  <div id="menu-container"></div>
    <div class="page-header">
      <div class="page-header-content">
        <div>
          <h1><i class="bi bi-people-fill"></i> Employee Attendance Viewer</h1>
        </div>
      </div>
    </div>


  <!-- Custom Web Component -->
  <employee-filter 
  data-api="/guests/active">
</employee-filter>
  <!-- data-api="/static/temp/sample.json"> -->
  <!-- Result Container -->
  <div id="result-container" style="margin:20px auto;white-space:pre;padding:10px;border-radius:6px;border:1px solid #ccc;"></div>
</div>
  <script>
    // Listen to event emitted from employee-filter
    document.addEventListener("filter-data", async (e) => {
      const filter = e.detail;
      console.log("Filter Data Received:", filter);

      // Simulate fetching records using filter
      const fakeResponse = {
        status: "success",
        message: "Data fetched successfully",
        filter
      };

      // Render JSON in container
      document.getElementById("result-container").textContent =
        JSON.stringify(fakeResponse, null, 2);
    });
  </script>



	<script src="./js/main.js"></script>
	<script>
		$(document).ready(function(){
			
			const username = JSON.parse(localStorage.getItem('wh_user') || '{}').name || '';
			if (!username) window.location.href = "login.html";
			$("#username").text(username);
		});
	</script>
</body>
</html>
