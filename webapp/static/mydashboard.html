    <script>
      // Set dash-table guest id dynamically from localStorage so it's not hardcoded.
      (function () {
        // Try common locations for guest id in localStorage
        const user = JSON.parse(localStorage.getItem("wh_user") || "{}") || {};
        const guestId = user.guest_id || user.id || localStorage.getItem("guest_id");

        if (!guestId) {
          console.warn("No guest id found in localStorage (wh_user.guest_id / wh_user.id / guest_id).");
          return;
        }

        document.querySelectorAll("dash-table").forEach((el) => {
          try {
            el.setAttribute("data-guest", guestId);
            // ensure a default limit if not set
            if (!el.getAttribute("data-limit")) el.setAttribute("data-limit", "10");
            // If the component exposes loadData (it does), call it to refresh with the new guest
            if (typeof el.loadData === "function") {
              // call asynchronously to avoid blocking
              setTimeout(() => {
                try {
                  el.loadData();
                } catch (e) {
                  console.warn("dash-table loadData failed", e);
                }
              }, 0);
            }
          } catch (e) {
            console.warn("Failed to initialize dash-table for guest", e);
          }
        });
      })();
    </script>
